version: '3.8'

services:

  # ══════════════════════════════════════════════════════════════════
  #  SHARED — needed by both batch and stream
  # ══════════════════════════════════════════════════════════════════

  spark-master:
    build: ./docker/spark
    container_name: spark-master
    profiles: [batch, stream]
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    command: bash -c "/opt/spark/sbin/start-master.sh -h spark-master && tail -f /opt/spark/logs/*"
    networks:
      - cyber-net

  # ══════════════════════════════════════════════════════════════════
  #  BATCH profile
  # ══════════════════════════════════════════════════════════════════

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    profiles: [batch, serve]
    environment:
      - CLUSTER_NAME=cyber-hadoop
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - hdfs-namenode:/hadoop/dfs/name
      - ./data:/data
    networks:
      - cyber-net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    profiles: [batch]
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    volumes:
      - hdfs-datanode:/hadoop/dfs/data
    networks:
      - cyber-net

  hbase:
    image: dajobe/hbase:latest
    container_name: hbase
    hostname: hbase-docker
    profiles: [batch, serve]
    depends_on:
      - namenode
    ports:
      - "9090:9090"
      - "16000:16000"
      - "16010:16010"
      - "16020:16020"
      - "16030:16030"
    command: sh -lc "start-hbase.sh && hbase thrift start -p 9090"
    networks:
      cyber-net:
        aliases:
          - hbase-docker

  spark-worker:
    build: ./docker/spark
    container_name: spark-worker
    profiles: [batch]
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
    volumes:
      - ./data:/data
    command: bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    networks:
      - cyber-net

  spark-worker-2:
    build: ./docker/spark
    profiles: [batch]
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
    volumes:
      - ./data:/data
    command: bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    networks:
      - cyber-net

  spark-batch:
    build: ./docker/spark
    container_name: spark-batch
    profiles: [batch]
    depends_on:
      - namenode
      - hbase
      - spark-master
    volumes:
      - ./batch/scripts:/app
      - ./data:/data
      - ./ml/scripts:/ml
    working_dir: /app
    command: tail -f /dev/null
    networks:
      - cyber-net

  # ══════════════════════════════════════════════════════════════════
  #  STREAM profile
  # ══════════════════════════════════════════════════════════════════

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    profiles: [stream]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    profiles: [stream]
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-setup:
    build: ./docker/kafka-setup
    container_name: kafka-setup
    profiles: [stream]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cyber-net

  cassandra:
    image: cassandra:4.1.7
    container_name: cassandra
    profiles: [stream, serve]
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=${CASSANDRA_CLUSTER_NAME}
      - CASSANDRA_DC=${CASSANDRA_DC}
      - HEAP_NEWSIZE=${HEAP_NEWSIZE}
      - MAX_HEAP_SIZE=${MAX_HEAP_SIZE}
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1.7
    container_name: cassandra-init
    profiles: [stream, serve]
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/cassandra-init.cql:/init.cql
    command: cqlsh cassandra -f /init.cql
    networks:
      - cyber-net

  spark-worker-stream:
    build: ./docker/spark
    container_name: spark-worker-stream
    profiles: [stream]
    depends_on:
      - spark-master
    environment:
      - SPARK_WORKER_MEMORY=${SPARK_WORKER_MEMORY}
      - SPARK_WORKER_CORES=${SPARK_WORKER_CORES}
    command: bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /opt/spark/logs/*"
    networks:
      - cyber-net

  producer:
    build: ./docker/spark
    container_name: kafka-producer
    profiles: [stream]
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    volumes:
      - ./streaming:/app
      - ./data:/data
    env_file:
      - .env
    working_dir: /app
    command: python3 -u kafka_producer.py
    networks:
      - cyber-net

  spark-streaming:
    build: ./docker/spark
    container_name: spark-streaming
    profiles: [stream]
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
    volumes:
      - ./streaming:/app
      - ./data:/data
      - spark-checkpoints:/tmp/spark-checkpoints-v3
    env_file:
      - .env
    working_dir: /app
    command: >
      spark-submit
      --master spark://spark-master:7077
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.3.0,com.datastax.spark:spark-cassandra-connector_2.12:3.3.0
      --conf spark.cassandra.connection.host=${CASSANDRA_HOST}
      spark_streaming.py
    networks:
      - cyber-net

# ── Test runner (unit tests, no live infra required) ─────────────────────
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    profiles: [test]
    command: python -m pytest tests/ -v --tb=short

# ── Serving Layer (FastAPI) ────────────────────────────────────────────────
  serving:
    build: ./serving
    container_name: serving
    profiles: [serve]
    depends_on:
      cassandra-init:
        condition: service_completed_successfully
      hbase:
        condition: service_started
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/data:ro
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    profiles: [serve]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      serving:
        condition: service_healthy
    networks:
      - cyber-net

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    profiles: [serve]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.sendgrid.net:2525
      - GF_SMTP_USER=apikey
      - GF_SMTP_PASSWORD=${SENDGRID_API_KEY}
      - GF_SMTP_FROM_ADDRESS=alert@project-demo.tech
      - GF_SMTP_FROM_NAME=CyberSecurity Alerts
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      serving:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - cyber-net


volumes:
  cassandra-data: {}
  hdfs-namenode: {}
  hdfs-datanode: {}
  spark-checkpoints: {}
  grafana-data: {}
  prometheus-data: {}

networks:
  cyber-net:
    driver: bridge
