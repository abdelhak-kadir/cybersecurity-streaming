version: '3.8'

# ══════════════════════════════════════════════════════════════════
#  Droplet 3 — "serve"
#  Services: FastAPI (internal), Grafana (internal), Caddy (public HTTPS)
#
#  Ansible replaces placeholders before `docker compose up`:
#    INFRA_PRIVATE_IP        → VPC IP of Droplet 1 (Cassandra :9042)
#    COMPUTE_PRIVATE_IP      → VPC IP of Droplet 2 (HBase Thrift :9090)
#    GRAFANA_SUBDOMAIN_PLACEHOLDER → e.g. grafana.example.com
#    GF_PASSWORD_PLACEHOLDER → Grafana admin password from .env
#
#  Public traffic flow:
#    Browser → Caddy :443 (HTTPS + Let's Encrypt)
#               ├─ grafana.example.com → grafana:3000  (always)
#               └─ api.example.com    → serving:8000   (EXPOSE_API=true only)
# ══════════════════════════════════════════════════════════════════

services:

  serving:
    build: ./serving
    container_name: serving
    # No public port — only reachable inside the Docker network (by Caddy)
    environment:
      - CASSANDRA_HOST=INFRA_PRIVATE_IP
      - CASSANDRA_PORT=9042
      - HBASE_HOST=COMPUTE_PRIVATE_IP
      - HBASE_PORT=9090
      - ML_SUMMARY_PATH=/data/ml_summary.json
    volumes:
      - ./data:/data:ro
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      serving:
        condition: service_healthy
    networks:
      - cyber-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    # No public port — Caddy terminates TLS and proxies here
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=GF_PASSWORD_PLACEHOLDER
      - GF_SERVER_ROOT_URL=https://GRAFANA_SUBDOMAIN_PLACEHOLDER
      - GF_SERVER_DOMAIN=GRAFANA_SUBDOMAIN_PLACEHOLDER
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource
      # ── Unified Alerting ──────────────────────────────────────
      - GF_ALERTING_ENABLED=false          # disable legacy alerting
      - GF_UNIFIED_ALERTING_ENABLED=true
      # ── SendGrid SMTP ─────────────────────────────────────────
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.sendgrid.net:2525
      - GF_SMTP_USER=apikey
      - GF_SMTP_PASSWORD=SENDGRID_API_KEY_PLACEHOLDER
      - GF_SMTP_FROM_ADDRESS=alert@project-demo.tech
      - GF_SMTP_FROM_NAME=CyberSecurity Alerts
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      serving:
        condition: service_healthy
      prometheus:
        condition: service_started
    networks:
      - cyber-net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"    # HTTP (Let's Encrypt ACME challenge + redirect to HTTPS)
      - "443:443"  # HTTPS
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # persists TLS certificates across restarts
      - caddy-config:/config
    depends_on:
      grafana:
        condition: service_started
      serving:
        condition: service_healthy
    networks:
      - cyber-net
    restart: unless-stopped

volumes:
  grafana-data: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}

networks:
  cyber-net:
    driver: bridge
