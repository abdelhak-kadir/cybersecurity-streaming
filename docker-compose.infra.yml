version: '3.8'

# ══════════════════════════════════════════════════════════════════
#  Droplet 1 — "infra"
#  Services: Kafka, Zookeeper, Cassandra, cassandra-init
#
#  INFRA_PRIVATE_IP is replaced by Ansible before `docker compose up`
#  with the real VPC private IP from terraform output.
# ══════════════════════════════════════════════════════════════════

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT  — internal bridge only (kafka-setup on this droplet)
      # PLAINTEXT_HOST — VPC-routable for producer + spark-streaming on Droplet 2
      # INFRA_PRIVATE_IP is substituted by Ansible with the real VPC IP
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://INFRA_PRIVATE_IP:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-setup:
    build: ./docker/kafka-setup
    container_name: kafka-setup
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - cyber-net

  cassandra:
    image: cassandra:4.1.7
    container_name: cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=CyberCluster
      - CASSANDRA_DC=datacenter1
      - HEAP_NEWSIZE=128M
      - MAX_HEAP_SIZE=512M
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - cyber-net
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  cassandra-init:
    image: cassandra:4.1.7
    container_name: cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./docker/cassandra-init.cql:/init.cql
    command: cqlsh cassandra -f /init.cql
    networks:
      - cyber-net

volumes:
  cassandra-data: {}

networks:
  cyber-net:
    driver: bridge
