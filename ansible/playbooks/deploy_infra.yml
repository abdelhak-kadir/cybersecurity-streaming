---
- name: Deploy infra layer — Kafka, Zookeeper, Cassandra (Droplet 1)
  hosts: infra
  become: true
  vars:
    compose_file: docker-compose.infra.yml
    project: /opt/cyber

  tasks:
    - name: Sync infra compose file
      synchronize:
        src: "{{ playbook_dir }}/../../docker-compose.infra.yml"
        dest: "{{ project }}/"

    - name: Sync docker build contexts (kafka-setup, cassandra-init CQL)
      synchronize:
        src: "{{ playbook_dir }}/../../docker/"
        dest: "{{ project }}/docker/"
        rsync_opts:
          - "--exclude=__pycache__"
          - "--exclude=spark"  # spark image not needed on infra

    - name: Inject VPC private IP into Kafka advertised listener
      replace:
        path: "{{ project }}/{{ compose_file }}"
        regexp: "INFRA_PRIVATE_IP"
        replace: "{{ infra_private_ip }}"

    - name: Start Zookeeper
      community.docker.docker_compose_v2:
        project_src: "{{ project }}"
        files: ["{{ compose_file }}"]
        services: [zookeeper]
        state: present

    - name: Wait for Zookeeper to be ready
      wait_for:
        port: 2181
        host: localhost
        timeout: 60

    - name: Start Kafka
      community.docker.docker_compose_v2:
        project_src: "{{ project }}"
        files: ["{{ compose_file }}"]
        services: [kafka]
        state: present

    - name: Wait for Kafka to be ready
      wait_for:
        port: 9092
        host: localhost
        timeout: 90

    - name: Check if Kafka topic already exists
      shell: >
        docker exec kafka kafka-topics --bootstrap-server localhost:9092 --list
        | grep -q cybersecurity-logs
      args:
        chdir: "{{ project }}"
      register: topic_exists
      ignore_errors: true

    - name: Run kafka-setup (creates cybersecurity-logs topic)
      shell: >
        docker compose -f {{ compose_file }} run --rm kafka-setup
      args:
        chdir: "{{ project }}"
      register: kafka_setup_result
      when: topic_exists.rc != 0

    - name: Show kafka-setup output
      debug:
        msg: "{{ kafka_setup_result.stdout_lines | default(['Topic already exists — skipped']) }}"

    - name: Start Cassandra
      community.docker.docker_compose_v2:
        project_src: "{{ project }}"
        files: ["{{ compose_file }}"]
        services: [cassandra]
        state: present

    - name: Wait for Cassandra to become healthy (up to 150s)
      shell: |
        for i in $(seq 1 30); do
          docker exec cassandra cqlsh -e "describe keyspaces" 2>/dev/null && exit 0
          sleep 5
        done
        echo "Cassandra did not become healthy in time" >&2
        exit 1
      args:
        chdir: "{{ project }}"

    - name: Check if Cassandra keyspace already has tables
      shell: >
        docker exec cassandra cqlsh -e "USE cybersecurity; DESCRIBE TABLES;" 2>/dev/null
        | grep -q realtime_threats
      args:
        chdir: "{{ project }}"
      register: tables_exist
      ignore_errors: true

    - name: Run cassandra-init (creates keyspace and tables)
      shell: >
        docker compose -f {{ compose_file }} run --rm cassandra-init
      args:
        chdir: "{{ project }}"
      register: cassandra_init_result
      when: tables_exist.rc != 0

    - name: Show cassandra-init output
      debug:
        msg: "{{ cassandra_init_result.stdout_lines | default(['Tables already exist — skipped']) }}"

    - name: Verify Cassandra schema
      shell: >
        docker exec cassandra cqlsh -e
        "USE cybersecurity; DESCRIBE TABLES;"
      register: schema_check

    - name: Show schema
      debug:
        msg: "{{ schema_check.stdout_lines }}"
