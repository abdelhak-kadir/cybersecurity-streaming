apiVersion: 1

policies:
  - orgId: 1
    receiver: email-alerts
    group_by: [severity]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: email-alerts
        matchers:
          - severity = critical
        group_wait: 10s
        repeat_interval: 1h
      - receiver: email-alerts
        matchers:
          - severity = warning
        group_wait: 1m
        repeat_interval: 4h
